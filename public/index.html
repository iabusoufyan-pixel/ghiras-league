@font-face{font-family:'Readex Pro';src:url(/fonts/readex-500.woff) format('woff');font-weight:500;font-display:swap}
@font-face{font-family:'Readex Pro';src:url(/fonts/readex-700.woff) format('woff');font-weight:600 900;font-display:swap}

/* Layout: a pitch-green scoreboard header over a quiet chalk-line workspace; tabs switch between the league's records and its print-ready posts */
:root{
  --bg:#eef1ee;--surface:#ffffff;--ink:#262a26;--muted:#7a847c;--line:#e6eae6;--soft:#f5f7f5;
  --pitch:#262a26;--pitch-ink:#ffffff;--flag:#3d8b3d;--flag-bright:#3d8b3d;
  --accent:#3d8b3d;--accent-soft:#ebf4e9;--lime:#a9c23f;--score:#262a26;
  --good:#3d8b3d;--bad:#b2342c;--warn:#a8621a;
  --display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121512;--surface:#1b201b;--ink:#e8ece7;--muted:#98a198;--line:#2a312a;--soft:#222822;
  --pitch:#0d100d;--pitch-ink:#ffffff;--flag:#5cb15c;--flag-bright:#5cb15c;
  --accent:#5cb15c;--accent-soft:#223a22;--lime:#b7cf4a;--score:#0d100d;
  --good:#6cbd69;--bad:#e3675d;--warn:#e0a052;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121512;--surface:#1b201b;--ink:#e8ece7;--muted:#98a198;--line:#2a312a;--soft:#222822;
  --pitch:#0d100d;--pitch-ink:#ffffff;--flag:#5cb15c;--flag-bright:#5cb15c;
  --accent:#5cb15c;--accent-soft:#223a22;--lime:#b7cf4a;--score:#0d100d;
  --good:#6cbd69;--bad:#e3675d;--warn:#e0a052;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
#root{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--flag-bright);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.hero{background:var(--pitch);color:var(--pitch-ink);border-radius:14px;padding:20px 20px 18px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:10px;border:1.5px solid rgba(255,255,255,.13);border-radius:8px;pointer-events:none}
.hero::after{content:"";position:absolute;width:180px;height:180px;border:1.5px solid rgba(255,255,255,.13);border-radius:50%;left:-60px;top:50%;transform:translateY(-50%);pointer-events:none}
.hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end;position:relative}
.eyebrow{font-size:13px;opacity:.75}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(34px,7vw,52px);line-height:1.05;margin:2px 0 0}
.hero-meta{font-size:14px;text-align:start}
.hero-meta b{font-family:var(--display);font-size:20px;color:var(--flag-bright)}
.progress{display:grid;grid-template-columns:repeat(var(--ndays,6),1fr);gap:6px;margin-top:16px;position:relative}
.pday{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px}
.pday span{height:6px;border-radius:2px;background:rgba(255,255,255,.16)}
.pday span.on{background:var(--flag-bright)}
.plabel{font-size:11px;opacity:.7;margin-top:3px}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px;font-size:14px;position:relative}
.facts span{opacity:.75}

.tabs{display:flex;gap:4px;margin:18px 0 14px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--flag-bright)}
.note{font-size:13px;color:var(--muted)}
.status{font-size:13px;color:var(--muted);margin-bottom:10px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600}
td.team,th.team{text-align:start}
tr:last-child td{border-bottom:0}
.pts{font-family:var(--display);font-weight:800;font-size:18px}
.rank{color:var(--muted);width:32px}
.chip{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.15)}
.form{display:inline-flex;gap:3px}
.form i{font-style:normal;width:20px;height:20px;border-radius:4px;font-size:11px;font-weight:700;display:grid;place-items:center;color:#fff}
.form .w{background:var(--good)}.form .d{background:var(--muted)}.form .l{background:var(--bad)}

.day{margin-bottom:14px}
.day-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.day-head h3{font-family:var(--display);font-size:19px;margin:0}
.day-head input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 8px;width:190px;max-width:100%}
.fx{padding:12px 14px;border-bottom:1px solid var(--line)}
.fx:last-child{border-bottom:0}
.fx-row{display:grid;grid-template-columns:28px 1fr auto 1fr auto;gap:10px;align-items:center}
.fx-n{color:var(--muted);font-size:12px}
.fx-a{justify-self:end}.fx-b{justify-self:start}
.score{font-family:var(--display);font-weight:800;font-size:20px;min-width:74px;text-align:center;background:var(--soft);border-radius:6px;padding:0 8px}
.score.pending{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);background:none}
.fx-goals{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;font-size:13px;color:var(--muted);margin-top:6px;padding-inline:38px 0}
.fx-goals div:first-child{text-align:end}
.loan{color:var(--warn);font-size:12px}
.squads{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.sq{padding:12px;display:grid;gap:10px;align-content:start;min-width:0}
.sq-head{display:flex;justify-content:space-between;align-items:center}
.sq-edit{display:grid;gap:8px}
.mini-pitch{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:8px;background-color:#22330b;background-size:cover;color:#f4f6ec;overflow:hidden}
.pm,.plm{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:2px;text-align:center;width:40%}
.pm-n{width:28px;height:28px;border-radius:50%;background:#f4f6ec;color:#22330b;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px}
.pm-p{font-size:12px;font-weight:600;line-height:1.3;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.pm-c{display:inline-block;background:#e2c12b;color:#22330b;border-radius:3px;padding:0 4px;font-size:10px;font-weight:800;text-shadow:none}
.sq-off{margin:0}
.pl-field{position:relative;flex:1;margin-block:-4px 8px}
.plm .pm-n{width:44px;height:44px;font-size:21px;font-family:var(--display)}
.plm .pm-p{font-family:var(--display);font-size:19px;font-weight:700}
.plm .pm-c{font-size:13px;padding:0 5px}
.pl-off{font-size:14px;color:rgba(244,246,236,.8);text-align:center;margin-bottom:8px}
.ch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.ch-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;align-content:start;text-align:start;min-width:0}
.ch-card.editing{border-color:var(--flag-bright)}
.ch-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ch-title{font-family:var(--display);font-weight:700;font-size:18px}
.ch-reward{font-family:var(--display);font-weight:800;font-size:20px;color:var(--flag);white-space:nowrap}
.ch-reward small{font-size:12px;color:var(--muted);font-weight:500}
.ch-ed{justify-self:start}
.ch-add{cursor:pointer;border-style:dashed;color:var(--muted);font-weight:600;place-items:center;min-height:90px;font-size:15px}
.ch-totals{display:flex;flex-wrap:wrap;gap:8px 22px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-weight:600}
.pc-row{display:flex;justify-content:space-between;align-items:center;padding:5px 16px;background:rgba(10,18,2,.38);border-radius:8px;margin-bottom:6px}
.pc-t{font-family:var(--display);font-weight:700;font-size:20px}
.pc-r{font-family:var(--display);font-weight:800;font-size:22px;color:#e2c12b}
.pc-r small{font-size:13px;color:rgba(244,246,236,.75)}
.float{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-inline-start:6px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--pitch);border-color:var(--pitch);color:var(--pitch-ink)}
.btn.danger{color:var(--bad)}
.btn.link{border:0;background:none;padding:4px 6px;color:var(--muted)}

.editor{margin-top:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:14px}
.ed-score{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:center}
.ed-score input{width:64px;text-align:center;font-family:var(--display);font-size:22px;font-weight:800;border:1px solid var(--line);border-radius:8px;padding:4px;background:var(--surface)}
.ed-sec h4{margin:0 0 6px;font-size:14px}
.rows{display:grid;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row input,.row select,.field input,.field select{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--surface);min-width:0}
.row input[type=text]{flex:1 1 160px}
.ed-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.warn{color:var(--warn);font-size:13px}

.scorers{list-style:none;margin:0;padding:6px 0}
.scorers li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.scorers li:last-child{border-bottom:0}
.sc-name{font-weight:700}
.sc-teams{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.sc-g{font-family:var(--display);font-weight:800;font-size:22px;display:flex;align-items:center;gap:10px}
.bar{height:6px;border-radius:3px;background:var(--flag-bright);display:inline-block}

.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;padding:14px}
.mcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.mbig{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.2}
.mline{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.section-h{font-family:var(--display);font-size:18px;margin:22px 0 8px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:14px;align-items:end}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{color:var(--ink)}
.empty{padding:18px;color:var(--muted);text-align:center}

.p-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--pitch);color:var(--pitch-ink)}
.p-wrap{width:100%;max-width:540px;margin:0 auto;overflow:hidden}
.p-scale{width:540px;transform-origin:top right}




/* ===== Ghiras skin: sports-channel cards, logo greens ===== */
body{background:var(--bg)}
.hero{background:var(--surface);color:var(--ink);border-radius:18px;padding:16px 18px 18px;box-shadow:0 10px 30px rgba(38,42,38,.07);border:1px solid var(--line)}
.hero::before{inset:auto 0 0 0;height:4px;border:0;border-radius:0;background:linear-gradient(90deg,var(--lime) 0 22%,var(--accent) 22% 100%)}
.hero::after{display:none}
.hero-top{align-items:center}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:58px;height:56px;object-fit:contain;background:#fff;border-radius:14px;padding:3px;flex:none}
.brand h1{font-size:clamp(26px,6vw,36px);font-weight:900;margin:0;line-height:1.1;letter-spacing:-.02em}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.hpill{font-size:12.5px;font-weight:800;padding:5px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.hero-meta{font-size:13px;color:var(--muted);margin-top:12px;position:relative}
.progress{margin-top:6px}
.pday span{background:var(--line)}
.pday span.on{background:var(--accent)}
.plabel{opacity:1;color:var(--muted)}
.facts span{opacity:1;color:var(--muted)}
.facts{color:var(--ink);font-weight:600}

.tabs{flex-wrap:wrap;overflow:visible;gap:6px;border-bottom:0;margin:16px 0 12px}
.tab{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 14px;margin:0;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.login-btn{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 14px;color:var(--accent);border-color:var(--accent);background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

.panel{border-radius:16px;border-color:var(--line);box-shadow:0 6px 20px rgba(38,42,38,.05)}
.chip{gap:8px;font-weight:800}
.cr{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:900;flex:none}
.standings td{border-bottom-color:var(--line)}
.standings tbody tr:nth-child(even){background:var(--soft)}
.standings .rank{font-family:var(--display);font-weight:900;font-size:18px;color:var(--muted);opacity:.6}
.standings tr.lead{background:linear-gradient(90deg,var(--accent-soft),transparent)}
.standings tr.lead .rank{color:var(--accent);opacity:1}
.standings tr.lead .cr{background:var(--accent);color:#fff}
.standings tr.lead .pts span,.standings tr.lead td.pts{color:var(--accent)}
.pts{font-weight:900}
.score{background:var(--score);color:#fff;border-radius:8px;min-width:78px}
.score.pending{background:none;color:var(--muted)}
.day-head h3{font-weight:900}
.bar{background:var(--accent)}
.sc-g{font-weight:900}
.ch-reward{color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* poster: fixed light look, it is the published image */
.poster{width:540px;min-height:675px;position:relative;background:#ffffff;color:#262a26;font-family:var(--body);overflow:hidden;direction:rtl}

.po-in{position:relative;min-height:675px;padding:30px 34px 22px;display:flex;flex-direction:column;z-index:1}
.po-head{display:flex;justify-content:space-between;align-items:center}
.po-brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px}
.po-brand img{width:46px;height:44px;object-fit:contain}
.po-pill{font-size:13px;font-weight:800;padding:5px 12px;border-radius:99px;background:#ebf4e9;color:#3d8b3d}
.po-title{font-weight:900;font-size:44px;line-height:1.05;letter-spacing:-.02em;margin-top:18px}
.po-sub{font-size:15px;font-weight:700;color:#7a847c;margin-top:6px}
.po-stripe{height:4px;margin:16px -34px 0;background:linear-gradient(90deg,#a9c23f 0 22%,#3d8b3d 22% 100%)}
.po-body{flex:1;margin-top:16px;display:flex;flex-direction:column;min-height:0}
.po-foot{margin-top:14px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:#7a847c;border-top:1px solid #e6eae6;padding-top:10px}
.pt-crest{width:36px;height:36px;border-radius:50%;background:#ebf4e9;color:#3d8b3d;display:grid;place-items:center;font-size:16px;font-weight:900;flex:none}
.pt-head,.pt-row{display:grid;grid-template-columns:38px 1fr 34px 34px 34px 34px 46px 58px;align-items:center;text-align:center}
.pt-head{font-size:12.5px;color:#7a847c;font-weight:700;padding:0 0 8px}
.pt-row{height:64px;border-radius:14px;font-size:18px;font-weight:700;color:#4a514a;margin-bottom:6px}
.pt-row:nth-child(odd){background:#f5f7f5}
.pt-row>span:first-child{font-weight:900;font-size:24px;color:#c3c9c4}
.pt-team{display:flex;align-items:center;gap:10px;text-align:start;font-weight:900;font-size:22px;color:#262a26}
.pt-pts{font-weight:900;font-size:26px;color:#262a26}
.pt-row.first{background:linear-gradient(90deg,#ebf4e9,#fff)}
.pt-row.first>span:first-child{color:#3d8b3d}
.pt-row.first .pt-crest{background:#3d8b3d;color:#fff}
.pt-row.first .pt-pts{background:#3d8b3d;color:#fff;border-radius:12px;height:44px;display:grid;place-items:center;margin-inline:4px;box-shadow:0 6px 14px rgba(61,139,61,.35)}
.pr-match{padding:14px 4px;border-bottom:1px solid #eef1ee}
.pr-match:last-child{border-bottom:0}
.pr-line{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.pr-line .a,.pr-line .b{display:flex;align-items:center;gap:9px;font-weight:900;font-size:21px}
.pr-line .b{justify-content:flex-end}
.pr-line .lose{color:#9aa29b}
.pr-line .lose .pt-crest{background:#f5f7f5;color:#9aa29b}
.pr-score{display:flex;border-radius:10px;overflow:hidden;font-weight:900;font-size:28px;line-height:1;color:#fff}
.pr-score span{padding:9px 13px;min-width:46px;text-align:center;background:#262a26}
.pr-score span+span{background:#3d8b3d}
.pr-sc{display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:15px;font-weight:600;color:#5d665e;margin-top:8px;padding-inline:4px;line-height:1.55}

/* newspaper — a fixed newsprint look, the same in light and dark */
.np-wrap{position:relative;max-height:560px;overflow:hidden;border-radius:12px}
.np-wrap.open{max-height:none}
.np-wrap:not(.open)::after{content:"";position:absolute;inset-inline:0;bottom:0;height:120px;background:linear-gradient(rgba(251,250,246,0),#fbfaf6)}
.np{background:#fbfaf6;color:#1d1f1d;padding:16px 16px 14px;font-family:var(--body);font-size:15px;line-height:1.8;border:1px solid #e3e1d8;border-radius:12px}
.np p{margin:0 0 6px}
.np b{font-weight:700;color:#111}
.np-mast{text-align:center;border-top:3px double #1d1f1d;border-bottom:3px double #1d1f1d;padding:6px 0}
.np-mast-row{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:#5c605b;font-weight:600}
.np-name{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-weight:700;font-size:clamp(30px,9vw,44px);line-height:1.2;letter-spacing:-.01em;margin:2px 0}
.np-name img{width:44px;height:42px;object-fit:contain}
.np-break{margin-top:12px;background:#1d1f1d;color:#fff;padding:12px 14px;position:relative}
.np-break b{color:#fff}
.np-break-tag{display:inline-block;background:#c0392b;color:#fff;font-family:var(--display);font-weight:700;font-size:12px;padding:2px 10px;margin-bottom:4px}
.np-break h4{margin:0 0 4px;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.35}
.np-break p{color:#e9ebe8;font-size:14.5px}
.np-front{padding:14px 0 12px;border-bottom:1px solid #1d1f1d}
.np-kicker{font-family:var(--display);font-weight:700;font-size:12.5px;color:#3d8b3d}
.np-head{font-family:var(--display);font-weight:700;font-size:clamp(26px,7.5vw,38px);line-height:1.2;margin:2px 0 8px;letter-spacing:-.01em;text-wrap:balance}
.np-lede p{font-size:16.5px;line-height:1.85;color:#2a2c2a}
.np-grid{display:grid;gap:14px;padding-top:12px}
.np-main,.np-side{min-width:0;display:grid;gap:12px;align-content:start}
.np-cols{display:grid;gap:12px}
.np-art{padding-bottom:10px;border-bottom:1px solid #d9d7cd}
.np-art:last-child{border-bottom:0}
.np-art-h{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.35;margin:1px 0 4px}
.np-need{font-size:14px;color:#3a5a3a;background:#eef4ea;border-inline-start:3px solid #3d8b3d;padding:4px 8px;margin-top:4px!important}
.np-box{border:1px solid #1d1f1d;background:#fff}
.np-box h4{margin:0;background:#1d1f1d;color:#fff;font-family:var(--display);font-weight:700;font-size:14px;padding:6px 10px}
.np-box-b{padding:8px 10px;font-size:14px}
.np-box ul{margin:0;padding-inline-start:18px}
.np-box li{margin-bottom:4px}
.np-tbl{width:100%;min-width:0;border-collapse:collapse;font-variant-numeric:tabular-nums}
.np-tbl td{padding:5px 4px;border-bottom:1px solid #ecebe4;text-align:center;font-size:14px}
.np-tbl td.n{text-align:start;font-family:var(--display);font-weight:700}
.np-tbl td.p{font-family:var(--display);font-weight:700;font-size:16px}
.np-tbl tr.top td.p{color:#3d8b3d}
.np-tbl tr:last-child td{border-bottom:0}
.np-dark{border-color:#3d8b3d}
.np-dark h4{background:#3d8b3d}
.np-stars{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.np-stars li{display:grid;gap:1px}
.np-stars b{font-family:var(--display);font-size:15px}
.np-stars span{font-size:13.5px;color:#3a3d3a;line-height:1.6}
.np-tribute{border-top:2px solid #1d1f1d;padding-top:10px;text-align:center}
.np-tribute-k{display:inline-block;font-family:var(--display);font-weight:700;font-size:15px;color:#fff;background:#3d8b3d;padding:4px 14px;border-radius:99px}
.np-tribute-h{font-family:var(--display);font-weight:700;font-size:clamp(28px,8vw,40px);line-height:1.2;margin:8px 0 4px;color:#1d1f1d}
.np-tribute .np-quote{border-top:0;padding-top:4px}
.np-quote{margin:0;padding:12px 4px;border-top:2px solid #1d1f1d;border-bottom:2px solid #1d1f1d;text-align:center}
.np-quote p{font-family:var(--display);font-weight:500;font-size:18px;line-height:1.6;margin:0}
.np-quote p::before{content:"«";color:#3d8b3d;font-weight:700}
.np-quote p::after{content:"»";color:#3d8b3d;font-weight:700}
.np-quote cite{display:block;font-style:normal;font-size:12.5px;color:#5c605b;margin-top:6px}
.np-bottom{display:grid;gap:12px;padding-top:12px;margin-top:12px;border-top:1px solid #1d1f1d}
.np-poll{background:#eef4ea;border-color:#3d8b3d}
.np-poll h4{background:#3d8b3d}
.np-foot{margin-top:12px;padding-top:8px;border-top:3px double #1d1f1d;text-align:center;font-size:11.5px;color:#5c605b;font-weight:600}
.np{container-type:inline-size}
@container (min-width:500px){
  .np-cols{grid-template-columns:1fr 1fr;column-gap:18px}
  .np-cols .np-art:nth-child(even){border-inline-start:1px solid #d9d7cd;padding-inline-start:18px}
  .np-cols .np-art:nth-last-child(-n+2){border-bottom:0}
  .np-bottom{grid-template-columns:1fr 1fr}
}
@container (min-width:760px){
  .np-grid{grid-template-columns:1fr 230px}
  .np-side{border-inline-start:1px solid #d9d7cd;padding-inline-start:14px}
}


.cat{font-style:normal;display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 3px;border-radius:5px;font-size:10.5px;font-weight:700;margin-inline-start:4px;vertical-align:1px;font-family:var(--display);text-shadow:none}

/* polls */

.pl-opt{text-align:start;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font-family:var(--display);font-weight:700;font-size:16px;cursor:pointer}

/* ===== students' page: season scrapbook (fixed look, same in light and dark) ===== */
body.scrap{--board:#1f4d3b;--paper:#f6f3ec;--kraft:#e4d6b8;--tape:#ecd25a;--leaf:#3d8b3d;--red:#b8442f;
  --surface:#f6f3ec;--ink:#1d2a22;--muted:#5f6b62;--line:#d6caae;--soft:rgba(255,255,255,.55);--accent:#3d8b3d;--accent-soft:#e3efd9;
  background-color:var(--board);background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.2px),radial-gradient(rgba(0,0,0,.06) 1px,transparent 1.4px);background-size:14px 14px,23px 23px;color:var(--ink);overflow-x:hidden;color-scheme:light}

.scrap .sc-wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 36px}

.scrap .tape{position:absolute;top:-10px;width:86px;height:22px;background:color-mix(in srgb,var(--tape) 88%,transparent);inset-inline-start:22px;transform:rotate(-4deg);z-index:2;clip-path:polygon(3% 0,97% 4%,100% 50%,96% 100%,2% 96%,0 50%)}

.scrap .ybtn{display:inline-flex;align-items:center;gap:6px;background:var(--tape);color:var(--ink);border:0;font-family:var(--display);font-weight:700;font-size:14px;padding:8px 14px;min-height:40px;clip-path:polygon(2% 6%,98% 0,100% 92%,4% 100%);text-decoration:none;cursor:pointer}
.scrap .gbtn{display:inline-flex;align-items:center;gap:6px;color:#fff;border:1.5px solid rgba(255,255,255,.55);background:transparent;font-family:var(--display);font-weight:700;font-size:14px;padding:8px 14px;min-height:40px;text-decoration:none;cursor:pointer}

.scrap .sc-logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:19px;color:var(--ink);text-decoration:none}
.scrap .sc-logo img{width:44px;height:42px;object-fit:contain}

const noun=(n,k)=>{const f=NOUNS[k],r=n%100;return n===1?f[0]:n===2?f[1]:(r>=3&&r<=10)||n===0?f[2]:n>100&&r<3?f[0]:f[3]};
const count=(n,k)=>n===1?NOUNS[k][0]+' '+NOUNS[k][4]:n===2?NOUNS[k][1]:ar(n)+' '+noun(n,k);

// باء الجر: «بـ٦ نقاط» مع الرقم، و«بنقطتين» مع الكلمة

// قرعة دوري لأي عدد من الفرق (طريقة الدائرة): تتكرر الأدوار بقلب الأرض كل دور، وتوزَّع على الجولات
function roundRobin(ids,days,perDay){
  const t=ids.length%2?[...ids,null]:[...ids],n=t.length,rounds=[];
  for(let r=0;r<n-1;r++){const pairs=[];for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a&&b)pairs.push(r%2?[b,a]:[a,b])}rounds.push(pairs);t.splice(1,0,t.pop())}
  const all=[];for(let leg=0;all.length<days*perDay&&rounds[0]&&rounds[0].length;leg++)rounds.forEach(p=>p.forEach(([a,b])=>all.push(leg%2?[b,a]:[a,b])));
  return all.slice(0,days*perDay).map(([a,b],i)=>({day:Math.floor(i/perDay)+1,slot:i%perDay+1,a,b}));
}

function table(upTo=99){
  const r={};S.teams.forEach(t=>r[t.id]={id:t.id,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,prize:0,form:[]});
  played(upTo).forEach(m=>{
    const A=r[m.a],B=r[m.b];if(!A||!B)return;
    A.p++;B.p++;A.gf+=m.ga;A.ga+=m.gb;B.gf+=m.gb;B.ga+=m.ga;
    if(m.ga>m.gb){A.w++;B.l++;A.pts+=3;A.prize+=PRIZE_W;A.form.push('w');B.form.push('l')}
    else if(m.ga<m.gb){B.w++;A.l++;B.pts+=3;B.prize+=PRIZE_W;B.form.push('w');A.form.push('l')}
    else{A.d++;B.d++;A.pts++;B.pts++;A.prize+=PRIZE_D;B.prize+=PRIZE_D;A.form.push('d');B.form.push('d')}
  });
  const ord=id=>S.teams.findIndex(t=>t.id===id);
  const rows=Object.values(r).sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||ord(x.id)-ord(y.id));
  // إن بقي التساوي بعد الفارق والأهداف يُحسم بالمواجهات المباشرة بين الفرق المتساوية
  for(let i=0;i<rows.length;){
    let j=i+1;const same=(a,b)=>a.pts===b.pts&&a.gf-a.ga===b.gf-b.ga&&a.gf===b.gf;
    while(j<rows.length&&same(rows[i],rows[j]))j++;
    if(j-i>1){
      const ids=new Set(rows.slice(i,j).map(x=>x.id)),h={};ids.forEach(id=>h[id]={pts:0,gd:0,gf:0});
      played(upTo).forEach(m=>{if(!ids.has(m.a)||!ids.has(m.b))return;const A=h[m.a],B=h[m.b];
        A.gf+=m.ga;B.gf+=m.gb;A.gd+=m.ga-m.gb;B.gd+=m.gb-m.ga;
        if(m.ga>m.gb)A.pts+=3;else if(m.ga<m.gb)B.pts+=3;else{A.pts++;B.pts++}});
      const part=rows.slice(i,j).sort((x,y)=>h[y.id].pts-h[x.id].pts||h[y.id].gd-h[x.id].gd||h[y.id].gf-h[x.id].gf||ord(x.id)-ord(y.id));
      rows.splice(i,j-i,...part);
    }
    i=j;
  }
  return rows;
}

function scorers(upTo=99){
  const map={};
  played(upTo).forEach(m=>(m.goals||[]).forEach(g=>{
    const k=canon(g.p);if(!k||/^(هدف )?عكسي$/.test(nm(k)))return; // الهدف العكسي يُحتسب في النتيجة لا في قائمة الهدافين
    const e=map[k]||(map[k]={name:k,g:0,by:{}});
    e.g++;const key=g.t+(isLoan(m,k,g.t)?'|loan':'');e.by[key]=(e.by[key]||0)+1;
  }));
  return Object.values(map).sort((a,b)=>b.g-a.g||a.name.localeCompare(b.name,'ar'));
}

function balances(){
  const t=table();const b={};
  t.forEach(r=>b[r.id]={prize:r.prize,inc:0,paid:0});
  (S.bonuses||[]).forEach(a=>{if(b[a.team])b[a.team].bonus=(b[a.team].bonus||0)+(+a.amount||0)});
  (S.awards||[]).forEach(a=>{if(b[a.team])b[a.team].ch=(b[a.team].ch||0)+(+a.amount||0)});
  let committee=0;
  S.transfers.forEach(x=>{const a=+x.amount||0;if(b[x.to])b[x.to].paid+=a;if(b[x.from])b[x.from].inc+=a/2;committee+=a/2});
  let loanCommittee=0;
  (S.loanLog||[]).forEach(l=>{const a=+l.fee||0;if(!a)return;if(b[l.to])b[l.to].loan=(b[l.to].loan||0)-a;

    if(l.payTo==='committee')loanCommittee+=a;else if(l.payTo==='half'){give(l.from,a/2);loanCommittee+=a/2}else give(l.from,a)});
  return {b,committee,loanCommittee};
}

}

function scrapBg(){

  let seed=11;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};

function parseReport(text){

  String(text||'').split('\n').forEach(l=>{const L=l.trim();if(/^[━─_\-=]{4,}$/.test(L)){blocks.push(cur);cur=[]}else cur.push(L)});blocks.push(cur);

    let type='plain';
    if(/التقرير الفني/.test(h))type='mast';

let FULL=false;
let VOTES={};
function adopt(j){
  CONFIGURED=j.configured!==false;FULL=!!j.full;VOTES=j.votes||{};
  if(j.data){S=j.data;ensure();VER=j.version||0}
  else VER=j.version||0;

}
async function load(silent){
  try{const committee=TOKEN&&canWrite;
    // الطالب يسأل أولًا: هل تغيّرت النسخة؟ ولا ينزّل البيانات كاملة إلا إن تغيّرت
    const {status:st,j}=committee?await api({action:'load',token:TOKEN}):await api(null,silent&&LOADED&&!FULL?VER:null);
    if(committee&&st===401){sessionEnded();return true}

/* ---------- نقل اللاعبين بين التشكيلات حسب صفقات المزاد ---------- */
const nm=v=>String(v||'').replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim();
// توحيد اسم اللاعب: الاسم المختصر (مثل «اسامة» أو «مشعان») يُردّ إلى الاسم الكامل المعتمد إن لم يحتمل غيره
function canon(p){p=String(p||'').trim();const k=nm(p);if(!k)return p;const tk=k.split(' ');
  const pool=[...Object.keys(S.categories||{}),...Object.values(S.lineups||{}).flat().map(r=>r.p),...(S.floaters||[])].map(x=>String(x||'').trim()).filter(Boolean);
  const hits=pool.filter(x=>{const xt=nm(x).split(' ');return tk.every(t=>xt.includes(t))});if(!hits.length)return p;
  const mx=Math.max(...hits.map(x=>nm(x).split(' ').length)),top=[...new Set(hits.filter(x=>nm(x).split(' ').length===mx).map(nm))];
  if(top.length!==1)return p;if(mx===tk.length&&nm(p)===top[0])return hits.find(x=>nm(x)===top[0]&&Object.keys(S.categories||{}).includes(x))||p;
  return hits.find(x=>nm(x)===top[0])}
function findRow(team,name){const L=(S.lineups[team]||[]),k=nm(name);if(!k)return null;
  let r=L.find(x=>nm(x.p)===k);if(r)return r;
  const c=L.filter(x=>{const a=nm(x.p);return a&&(k.includes(a)||a.includes(k))});return c.length===1?c[0]:null}
function freeN(team,pref){const used=new Set((S.lineups[team]||[]).map(x=>x.n));if(pref!=null&&!used.has(pref))return pref;let n=2;while(used.has(n))n++;return n}
// ينقل لاعبًا من فريق إلى آخر، ويعيد true إن صار في الفريق الجديد
function movePlayer(name,from,to,n){S.lineups[to]=S.lineups[to]||[];
  const r=findRow(from,name);
  if(r){S.lineups[from]=S.lineups[from].filter(x=>x!==r);S.lineups[to].push({...r,n:freeN(to,n!=null?n:r.n),c:false});return true}
  if(findRow(to,name))return true;
  S.lineups[to].push({n:freeN(to,n),p:name,c:false});S.floaters=(S.floaters||[]).filter(f=>nm(f)!==nm(name));return true}
function applyTransfer(x){S.lineups=S.lineups||{};
  if(x.smv&&x.smv!==x.swap){movePlayer(x.smv,x.from,x.to);delete x.smv}
  const pr=!x.mv?findRow(x.from,x.player):null, sr=x.swap&&x.smv!==x.swap?findRow(x.to,x.swap):null;
  if(pr&&sr){S.lineups[x.from]=S.lineups[x.from].filter(r=>r!==pr);S.lineups[x.to]=S.lineups[x.to].filter(r=>r!==sr);
    S.lineups[x.to].push({...pr,n:sr.n,c:false});S.lineups[x.from].push({...sr,n:pr.n,c:false});x.mv=true;x.smv=x.swap;return}
  if(!x.mv){movePlayer(x.player,x.from,x.to);x.mv=true}
  if(x.swap&&x.smv!==x.swap){movePlayer(x.swap,x.to,x.from);x.smv=x.swap}}
function revertTransfer(x){if(x.smv){movePlayer(x.smv,x.from,x.to);delete x.smv}if(x.mv){movePlayer(x.player,x.to,x.from);delete x.mv}}
// تُشغَّل عند دخول اللجنة: تطبّق الصفقات التي لم تنعكس على التشكيلات بعد
// الإصلاحات اليدوية القديمة لبيانات الجولة الثالثة طُبّقت وحُفظت (وأثرها في S.fixes)، فلم تعد هنا
function syncTransfers(){let ch=false;
  // توحيد الأسماء المختصرة في الأهداف والإعارات المسجّلة سابقًا
  S.matches.forEach(m=>(m.goals||[]).forEach(g=>{const c=canon(g.p);if(c!==g.p){g.p=c;ch=true}}));
  (S.loanLog||[]).forEach(l=>{const c=canon(l.p);if(c!==l.p){l.p=c;ch=true}});
  S.transfers.forEach(x=>{if(!x.mv||(x.swap||null)!==(x.smv||null)){applyTransfer(x);ch=true}});
  return ch}
// يُحفظ في الجوال مفتاح جلسة مؤقت يصدره الخادم، لا رمز اللجنة نفسه
const TOKEN_KEY='ghiras-token';
async function login(pin,quiet){

  if(st===200&&j.token){TOKEN=j.token;canWrite=true;ui.login=false;try{localStorage.setItem(TOKEN_KEY,TOKEN)}catch(e){};await load();if(FULL&&syncTransfers()){render();await save('طُبّقت الصفقات على التشكيلات')}render();if(!quiet)toast('مرحبًا بك في وضع اللجنة');return}

}
async function resume(){

function dropSession(){TOKEN=null;canWrite=false;ui.dirty=null;ui.hist=null;ui.edit=ui.sqEdit=ui.cEdit=null;try{localStorage.removeItem(TOKEN_KEY)}catch(e){}}
function sessionEnded(){dropSession();toast('انتهت الجلسة، ادخل بالرمز مرة أخرى','err');load().then(render)}
function logout(){const t=TOKEN;dropSession();if(t)api({action:'logout',token:t}).catch(()=>{});load().then(render)}
let saving=false;
async function save(okMsg){
  if(!canWrite||!TOKEN||!FULL){toast('ادخل بوضع اللجنة أولًا','err');return}
  if(saving){toast('انتظر اكتمال الحفظ السابق','err');return}
  saving=true;
  try{
    const {status:st,j}=await api({action:'save',token:TOKEN,version:VER,data:S});
    if(st===200){VER=j.version;const was=ui.dirty;ui.dirty=null;if(was)render();toast(okMsg)}
    else if(st===409){ui.dirty=null;toast('عدّل عضو آخر البيانات قبلك، فحمّلت آخر نسخة. أعد إدخال تعديلك','err');ui.edit=ui.sqEdit=ui.cEdit=null;await load();render()}
    else if(st===401){ui.dirty=null;sessionEnded()}
    else{ui.dirty=null;toast(j.error||'تعذّر الحفظ، حاول مرة أخرى','err');await load();render()}
  }catch(e){
    // انقطع الاتصال: يبقى التعديل على الشاشة مع شريط ثابت يذكّر بأنه لم يُحفظ، حتى تعيد المحاولة
    ui.dirty=okMsg||'حُفظ التعديل';render();toast('لا يوجد اتصال، لم يُحفظ التعديل','err')}
  finally{saving=false}
}

  else if(act==='lpt')dr.loans[+el.dataset.i].payTo=el.value;
  else if(act==='lday'){ui.lday=+el.value;render()}
  else if(act==='rpday'){ui.redit=+el.value;ui.confirm=null;render()}
  else if(act==='pday'){ui.pday=+el.value;render()}
  else if(act==='pteam'){ui.pteam=el.value;render()}
  else if(act==='nf'){ui.nDraft=ui.nDraft||{};ui.nDraft[el.dataset.f]=el.value}
  else if(act==='sqc'){ui.sqDraft[+el.dataset.i].c=el.checked}
  else if(act==='date'){const v=el.value.trim();if(v)S.dayDates[el.dataset.d]=v;else delete S.dayDates[el.dataset.d];clearTimeout(dateTimer);dateTimer=setTimeout(()=>save('حُفظ التاريخ'),400)}
});

root.addEventListener('submit',ev=>{if(ev.target.id!=='loginform')return;ev.preventDefault();const v=document.getElementById('pin').value.trim();if(v)login(v)});

// مكتبة تصدير الصور محفوظة داخل المشروع، وتُحمَّل عند أول تصدير فقط
let h2c=null;
const loadH2c=()=>h2c||(h2c=new Promise((ok,no)=>{if(window.html2canvas)return ok();const e=document.createElement('script');e.src='/vendor/html2canvas.min.js';e.onload=ok;e.onerror=()=>{h2c=null;no()};document.head.appendChild(e)}));
async function exportPng(pid,kind){
  const card=document.getElementById(pid||'poster'),sc=card&&card.closest('.p-scale');
  try{await loadH2c()}catch(e){}
  if(!card||!window.html2canvas){toast('تعذّر تجهيز الصورة؛ خذ لقطة شاشة للبطاقة','err');return}
  const prev=sc.style.transform;sc.style.transform='none';
  const stg=card.closest('.sc-stage');if(stg)stg.classList.add('on');
  try{
    await (document.fonts&&document.fonts.ready);
    const c=await html2canvas(card,{scale:2,backgroundColor:'#ffffff',logging:false});
    sc.style.transform=prev;if(stg)stg.classList.remove('on');
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));
    const names={next:'الجولة-القادمة',table:'الترتيب',results:'النتائج',scorers:'الهدافون',lineup:'تشكيلة-'+T(ui.pteam).name,challenges:'التحديات'};
    const fanNames={standings:'الترتيب',next:'الجولة-القادمة',results:'النتائج-الجولة-'+ui.sday,scorers:'الهدافون',lineups:'تشكيلة-'+T(ui.pteam).name,challenges:'التحديات'};
    const name=kind&&kind.startsWith('news-')?'دوري-غراس-خبر.png':kind?`دوري-غراس-${fanNames[kind]}.png`:ui.ptype==='challenges'?'دوري-غراس-التحديات.png':ui.ptype==='lineup'?`دوري-غراس-${names.lineup}.png`:`دوري-غراس-${names[ui.ptype]}-الجولة-${ui.pday}.png`;
    const file=new File([blob],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:'دوري غراس'});return}catch(e){if(e&&e.name==='AbortError')return}
    }
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
    toast('نُزّلت الصورة');
  }catch(e){sc.style.transform=prev;if(stg)stg.classList.remove('on');toast('تعذّر تجهيز الصورة؛ خذ لقطة شاشة للبطاقة','err')}
}

render();
(async()=>{
  await load();render();
  // الإصدار السابق كان يحفظ رمز اللجنة نفسه في الجوال: نستبدله بمفتاح جلسة ثم نمسحه
  let old=null;try{old=localStorage.getItem('ghiras-pin');localStorage.removeItem('ghiras-pin')}catch(e){}
  if(!CONFIGURED||!isLajna())return;
  if(old)await login(old,true);else await resume();
  render();
})();
setInterval(async()=>{
  if(document.hidden||saving||ui.dirty||ui.edit||ui.sqEdit||ui.cEdit||ui.login)return;
  const a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='SELECT'))return;
  if(await load(true))render();
},30000);
document.addEventListener('visibilitychange',async()=>{if(!document.hidden&&!saving&&!ui.dirty&&!ui.edit&&!ui.sqEdit&&!ui.cEdit&&await load(true))render()});
})();
